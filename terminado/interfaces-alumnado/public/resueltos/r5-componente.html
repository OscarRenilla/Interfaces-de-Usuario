<!DOCTYPE html>
<!-- Declara que esto es una pagina HTML5 -->
<html lang="es">
<!-- Inicio del documento, idioma espanol -->
<head>
  <!-- HEAD: informacion que NO se ve en la pagina -->
  <meta charset="UTF-8">
  <!-- Permite tildes y enyes -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Hace que la pagina se adapte al movil (responsive) -->
  <title>R5 Componente propio</title>
  <!-- Titulo de la pestana del navegador -->
  <link rel="stylesheet" href="/css/estilos.css">
  <!-- Carga los estilos (colores, tamanos) desde el fichero CSS -->
<script src="/js/errores.js"></script></head>
<body>
  <!-- BODY: todo lo que SI se ve en la pagina -->
  <div class="nav"><a href="/index.html">&#127968; Inicio</a><a href="/resueltos/r4-mano-puntero.html">&larr; R4</a><a href="/resueltos/r6-pruebas.html">R6 &rarr;</a></div>
  <!-- Barra de navegacion: volver al inicio, ejercicio anterior y siguiente -->
  <h1>R5 Componente propio</h1>
  <!-- Titulo grande de la pagina -->
  <div class="caja"><b>Criterios:</b> RA3 b, c, d, h. Creas y usas tu propia etiqueta HTML.</div>
  <!-- Caja informativa con los criterios de evaluacion que trabaja el ejercicio -->
  <div class="caja">
    <erp-tarjeta></erp-tarjeta>
    <!-- Sin atributos: se ven los valores por defecto -->
    <br>
    <erp-tarjeta id="clientes" titulo="Clientes" valor="..." color="#17753a"></erp-tarjeta>
    <!-- Tarjeta con atributos; el valor lo rellenaremos con JavaScript -->
    <br>
    <erp-tarjeta id="productos" titulo="Productos" valor="..." color="#d97706"></erp-tarjeta>
    <!-- Otra tarjeta con otro color -->
    <p>Ultimo clic: <b id="clic">-</b></p>
    <!-- Aqui se escribe la tarjeta pulsada -->
  </div>
  <!-- Aqui acaba el HTML visible; ahora viene el codigo JavaScript (el "cerebro") -->
  <script type="module">
// Cargamos el componente (esto ejecuta customElements.define y registra <erp-tarjeta>)
await import('/componentes/erp-tarjeta.js');
// Pedimos las listas al servidor
const clientes = await (await fetch('/api/customers')).json(); // lista de clientes
const productos = await (await fetch('/api/products')).json(); // lista de productos
document.getElementById('clientes').valor = clientes.length;   // ponemos el numero (usa el "set valor" del componente)
document.getElementById('productos').valor = productos.length; // igual para productos
// Escuchamos el evento propio "seleccionada" que lanza el componente
document.addEventListener('seleccionada', (e) => {
  document.getElementById('clic').textContent = e.detail.titulo + ' = ' + e.detail.valor; // mostramos sus datos
});
  </script>
</body>
</html>
